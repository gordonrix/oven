<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OVE editor demo</title>
    <link rel="stylesheet" href="ove.css" />
    <link rel="stylesheet" href="rowView.css" />
    <link rel="stylesheet" href="newPrimer.css" />
    <link rel="stylesheet" href="aminoAcid.css" />
    <!--
      A real createVectorEditor mount, standing in for the custom editor tab.

      The other demo pages exercise our own panels against a stubbed host. This
      one exists for what only appears once OVE's own editor is on screen: its
      menu bar, its right-click menus, and the redux state behind Filter Cut
      Sites. The script order and the button row mirror src/editorHtml.js, and
      have to keep mirroring it for this to be worth anything.
    -->
    <style>
      html, body { width: 100%; height: 100%; margin: 0; }
      .ove-created-div { height: 100%; background-color: white; }
      .ove-toolbtns {
        position: fixed; top: 5px; right: 16px; z-index: 20000; display: flex; gap: 4px;
      }
      .ove-toolbtns button {
        height: 30px; padding: 5px 10px; color: #182026; background: none; border: none;
        border-radius: 3px; font-family: Arial, sans-serif; font-size: 14px; font-weight: 400;
        cursor: pointer; white-space: nowrap;
      }
      .ove-toolbtns button:hover { background-color: rgba(167, 182, 194, .3); }
      .ove-toolbtns button:active { background-color: rgba(115, 134, 148, .3); }
      .ove-toolbtns button:disabled { color: rgba(92, 112, 128, .6); cursor: not-allowed; }
      /* Mirrors the hover label in editorHtml.js BASE_STYLE. */
      .ove-toolbtns button { position: relative; }
      .ove-toolbtns button[data-oven-tip]::after {
        content: attr(data-oven-tip);
        position: absolute; top: 100%; right: 0; margin-top: 4px;
        padding: 4px 8px; border-radius: 3px;
        background: #182026; color: #f5f8fa; font-size: 12px;
        white-space: pre; pointer-events: none;
        opacity: 0; transition: opacity .12s ease-in .35s;
      }
      .ove-toolbtns button[data-oven-tip]:hover::after { opacity: 1; }

      /* Mirrors editorHtml.js BASE_STYLE: a protein has no melting temperature. */
      body.oven-protein [data-test="veStatusBar-selection-tm"],
      body.oven-protein [data-test="veStatusBar-selection-tm"] + .veStatusBarSpacer {
        display: none;
      }

      /* Stands in for the gutter the real webview leaves down its right side,
       * which is what the button row has to be measured against. */
      body { padding-right: 46px; box-sizing: border-box; background: #1e1e1e; }
    </style>
  </head>
  <body>
    <div class="ove-toolbtns">
      <button id="ove-align-button" class="ove-align-btn">Align</button>
      <button id="ove-seqsearch-button" class="ove-seqsearch-btn">Sequence Search</button>
      <button id="ove-search-button" class="ove-search-btn">Primer Search</button>
      <button id="ove-cart-button" class="ove-cart-btn">Add to Cart</button>
      <button id="save-button" class="save-button">Save</button>
    </div>
    <script>
      const posted = [];
      window.acquireVsCodeApi = () => ({
        postMessage: (m) => {
          posted.push(m);
          document.getElementById('posted').textContent = JSON.stringify(posted);
        },
        getState: () => ({}), setState: () => {}
      });
    </script>
    <script>
      window.__ovenNewPrimerHotkey = "mod+shift+k";
      window.__ovenSearchPrimersHotkey = "mod+alt+f";
      window.__ovenAlignHotkey = "mod+alt+l";
      window.__ovenCartHotkey = "mod+alt+k";
      // The bundle's Align command calls this; the real page posts to the host.
      window.ovenOpenAlign = function () {
        window.__alignOpened = (window.__alignOpened || 0) + 1;
        document.title = 'align:' + window.__alignOpened;
      };
    </script>
    <script src="index.umd.js"></script>
    <script src="bioparser2.umd.js"></script>
    <script>
      /*
       * ?protein opens a protein FASTA the way src/editorProvider.js does: parsed
       * with the parser's protein guess switched on, so OVE gets isProtein and
       * goes into its own protein mode. The page then mirrors editorHtml.js's
       * protein branch -- Align is the only button, and none of the DNA tools
       * are wired in.
       */
      window.__PROTEIN = new URLSearchParams(location.search).has('protein');
      if (window.__PROTEIN) {
        document.body.classList.add('oven-protein');
        for (const id of ['ove-seqsearch-button', 'ove-search-button', 'ove-cart-button']) {
          const b = document.getElementById(id);
          if (b) b.remove();
        }
      }
    </script>
    <script>
      /*
       * Stands in for primerSearch.js's override, which is what carries the
       * Change Amino Acid entry in the real page. Resolved at click time, so
       * aminoAcid.js loading further down is fine.
       */
      window.OveSearchStub = {
        translationRightClicked: (items, opts, props) => {
          // Kept so a test can open the dialog without driving the popover.
          window.__lastTranslation = opts;
          window.__lastProps = props;
          return [...items,
            ...(window.OveAminoAcid ? window.OveAminoAcid.menuItems(opts, props) : [])];
        }
      };
      document.addEventListener('__openAA', (e) => {
        const opts = window.__lastTranslation;
        if (!opts) return;
        try {
          window.OveAminoAcid.open(opts.annotation, e.detail.index,
            (window.__lastProps || {}).updateSequenceData);
        } catch (err) {
          document.getElementById('aaError').textContent = String(err && err.stack || err);
        }
      });
    </script>
    <script src="newPrimer.js"></script>
    <script>
      const SEQ = ('GAATTCGGATCCAAGCTTGCGGCCGCTCTAGAGTCGACCTGCAGGCATGCAAGCTTGGCACTGGCCGTCGTTTTAC' +
        'AACGTCGTGACTGGGAAAACCCTGGCGTTACCCAACTTAATCGCCTTGCAGCACATCCCCCTTTCGCCAGCTGGCGTAATAGCG').repeat(3);
      const editor = window.createVectorEditor('createDomNodeForMe', {
        withPreviewMode: false, editorName: 'VectorEditor', showMenuBar: true,
        showReadOnly: true, disableSetReadOnly: false, disableBpEditing: false,
        rightClickOverrides: window.__PROTEIN ? {} : (window.OveSearchStub || {}),
        // Mirrors src/editorHtml.js.
        panelMap: window.__PROTEIN ? undefined : window.OveNewPrimer.panelMap,
        // Mirrors src/editorHtml.js: OVE's default toolbar without its own
        // alignment tool, which would sit a few pixels from our Align and do
        // something else.
        ToolBarProps: {
          toolList: ['saveTool', 'downloadTool', 'importTool', 'undoTool', 'redoTool',
            'cutsiteTool', 'featureTool', 'partTool', 'oligoTool', 'orfTool',
            'editTool', 'findTool', 'visibilityTool']
        },
        // Mirrors src/editorHtml.js: this is what makes OVE's File > Save and
        // its mod+s hotkey available at all.
        onSave: function (opts, tidiedData, props, onSuccessfulSave) {
          document.getElementById('saved').textContent =
            String(Number(document.getElementById('saved').textContent || 0) + 1);
          if (onSuccessfulSave) onSuccessfulSave();
        }
      });
      window.__oveEditor = editor;
      /*
       * ?linear opens the same sequence as a linear one, which is what a plain
       * .gb without "circular" in its LOCUS line is. ?map brings a map tab up
       * instead of the sequence -- separate flags because every other check
       * here works on the sequence letters and must keep landing on them.
       */
      const params = new URLSearchParams(location.search);
      const LINEAR = params.has('linear') || window.__PROTEIN;
      const MAP = params.has('map');
      /*
       * Synthetic, like every sequence in this repo: all twenty residues, with
       * E F I L P Q W -- the ones that are not also nucleotide letters, and so
       * the ones a DNA parse silently deletes -- in every repeat.
       */
      const PROTEIN_FASTA = '>demo-protein\n' +
        'MKEFILPQWYHRDNSTVGACEQLPWFIKYMSTRPEELFKQIGNWDHLAVPRSEYTQCMFIKL'.repeat(4) + '\n';
      window.__PROTEIN_INPUT = PROTEIN_FASTA.split('\n')[1];
      const proteinData = () => window.bioParsers.fastaToJson(PROTEIN_FASTA, {
        fileName: 'demo.faa', guessIfProtein: true, guessIfProteinOptions: { loose: true }
      })[0].parsedSequence;
      editor.updateEditor({
        sequenceData: window.__PROTEIN ? proteinData() : {
          name: 'demo-plasmid', circular: !LINEAR, sequence: SEQ,
          features: [
            { id: 'f1', name: 'demo CDS', start: 12, end: 110, forward: true, type: 'CDS' },
            { id: 'f2', name: 'rev CDS', start: 150, end: 248, forward: false, type: 'CDS' }
          ]
        },
        // Mirrors src/editorHtml.js: a linear sequence has no Circular Map tab
        // at all, since OVE only draws it there to warn you off it.
        panelsShown: [[
          { id: 'sequence', name: 'Sequence Map', active: !MAP },
          ...(LINEAR ? [] : [{ id: 'circular', name: 'Circular Map', active: MAP }]),
          { id: 'rail', name: 'Linear Map', active: MAP && LINEAR },
          { id: 'properties', name: 'Properties', active: false }
        ]],
        readOnly: false,
        annotationVisibility: window.__PROTEIN
          ? {}
          : { translations: true, cdsFeatureTranslations: true }
      });
    </script>
    <!--
      A DOM bridge. The browser harness evaluates in an isolated world, so it
      can read the DOM but not page globals like the editor handle -- state has
      to be published into an element for a test to see it.
    -->
    <script id="editorState" type="application/json">{}</script>
    <script id="posted" type="application/json">[]</script>
    <script id="rightClick" type="application/json">{}</script>
    <script id="copyLog" type="application/json">[]</script>
    <script id="copyJson" type="application/json"></script>
    <span id="saved" hidden>0</span>
    <pre id="aaError" style="display:none"></pre>
    <script>
      const publish = () => {
        const sd = editor.getState().sequenceData;
        document.getElementById('editorState').textContent = JSON.stringify({
          restrictionEnzymes: editor.getState().restrictionEnzymes,
          sequence: sd.sequence,
          isProtein: Boolean(sd.isProtein),
          proteinSequence: sd.proteinSequence || null,
          // What media/docSync.js compares to decide whether there are unsaved changes.
          stateTrackingId: sd.stateTrackingId || null,
          lastSavedId: editor.getState().lastSavedId || null,
          proteinInput: window.__PROTEIN_INPUT || null,
          // What File > Save would write for a protein FASTA: the host saves
          // through jsonToFasta, which prefers proteinSequence.
          savedFasta: window.__PROTEIN ? window.bioParsers.jsonToFasta(sd) : null,
          // Bridged because patchright evaluates in an isolated world, where
          // window.__oveEditor is not reachable.
          primers: Object.values(editor.getState().sequenceData.primers || {})
            .map((p) => ({ name: p.name, start: p.start, end: p.end, forward: p.forward, bases: p.bases })),
          // Features too, so a test can see whether a copy carried them.
          features: Object.values(editor.getState().sequenceData.features || {})
            .map((f) => ({ name: f.name, start: f.start, end: f.end }))
        });
      };
      publish();
      // Drives the editor from a test: detail is an updateEditor payload.
      document.addEventListener('__updateEditor', (e) => {
        editor.updateEditor(e.detail);
        setTimeout(publish, 50);
      });
      document.addEventListener('__publish', publish);
    </script>
    <script src="toolButtons.js"></script>
    <script src="docSync.js"></script>
    <script src="cutSites.js"></script>
    <script src="cartShared.js"></script>
    <script src="codonUsage.js"></script>
    <script src="codonEdit.js"></script>
    <script src="aminoAcid.js"></script>
    <script>
      // Mirrors editorHtml.js.
      window.OveDocSync.init(acquireVsCodeApi(), editor);
      // Mirrors editorHtml.js: none of these mean anything for a protein.
      if (!window.__PROTEIN) {
        window.OveCutSites.init(acquireVsCodeApi(), editor, null);
        window.OveAminoAcid.init(acquireVsCodeApi(), editor);
        window.OveNewPrimer.init(editor);
      }
      // DOM bridges: patchright evaluates in an isolated world, so a test
      // can reach the DOM but not these globals.
      document.addEventListener('__openNewPrimer', () => window.OveNewPrimer.open());
      document.addEventListener('__closeNewPrimer', () => window.OveNewPrimer.hidePanel());
      /*
       * Records what the editor puts on the clipboard. Installed from here
       * rather than from a test: the driver evaluates in an isolated world, so
       * patching navigator.clipboard there patches a different object. The real
       * write still runs, and is allowed to fail -- a headless browser refuses
       * it without a user gesture.
       */
      /*
       * What a copy put on the clipboard.
       *
       * Two channels, because the editor uses whichever is available: it sets
       * text/plain and application/json on the copy event when there is one,
       * and falls back to navigator.clipboard.writeText when there is not. A
       * headless browser performs neither, so both are recorded here.
       */
      document.addEventListener('__captureCopies', () => {
        if (window.__copiesCaptured) return;
        window.__copiesCaptured = true;
        const log = document.getElementById('copyLog');
        const record = (text) => {
          const arr = JSON.parse(log.textContent || '[]');
          arr.push(String(text));
          log.textContent = JSON.stringify(arr);
        };
        // Bubble phase, so the editor's own handler has already run and set it.
        document.addEventListener('copy', (e) => {
          const text = e.clipboardData && e.clipboardData.getData('text/plain');
          if (text) record(text);
          const json = e.clipboardData && e.clipboardData.getData('application/json');
          document.getElementById('copyJson').textContent = json || '';
        });
        const orig = navigator.clipboard.writeText.bind(navigator.clipboard);
        navigator.clipboard.writeText = (text) => {
          record(text);
          return orig(text).catch(() => {});
        };
      });
    </script>
  </body>
</html>
