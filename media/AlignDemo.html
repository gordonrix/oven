<!DOCTYPE html>
<!--
  Standalone harness for the alignment panel, driving the real OVE bundle with
  no VS Code involved. The extension host is stubbed: align/run is answered
  from a pre-computed alignment, so the client half (setup strip, drop zone,
  createAlignmentView payload) is exercised without needing MAFFT in the
  browser.

  Playwright's page.evaluate runs in an isolated world and cannot see this
  page's globals, so everything a test needs is mirrored into DOM nodes:
    #posted   messages sent to the stubbed host
    body[data-ready]

  Excluded from the VSIX by .vscodeignore.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ove.css" />
    <link rel="stylesheet" href="alignView.css" />
    <style>html, body { width: 100%; height: 100%; margin: 0; }</style>
  </head>
  <body>
    <div id="posted" style="display:none">[]</div>

    <script>
      window.__posted = [];
      const syncPosted = () => {
        document.getElementById('posted').textContent = JSON.stringify(window.__posted);
      };

      /*
       * A short reference and three reads, one per verdict:
       *   CLEAN    spans the whole reference, no differences  -> match
       *   WINDOW   perfect, but covers only the middle        -> partial match
       *   DELETED  three bases missing                        -> mismatch
       */
      const REF = 'ACGTACGTAAGGCCTTACGTTGCATTAGCA'.repeat(10); // 300 bp
      const CLEAN = REF;
      // A Sanger-sized window: comfortably over the 50 bp floor below which a
      // perfect stretch is treated as luck rather than evidence.
      const WINDOW = REF.slice(60, 200);
      const WINDOW_ROW = '-'.repeat(60) + WINDOW + '-'.repeat(REF.length - 200);
      const DELETED = REF.slice(0, 150) + REF.slice(153);
      const DELETED_ROW = REF.slice(0, 150) + '---' + REF.slice(153);

      function fakeChrom(seq) {
        return {
          baseCalls: seq.split(''),
          qualNums: seq.split('').map(() => 45),
          baseTraces: seq.split('').map((b) => {
            const t = { aTrace: [], tTrace: [], gTrace: [], cTrace: [] };
            for (let i = 0; i < 5; i++) {
              const h = i === 2 ? 900 : 150;
              t.aTrace.push(b === 'A' ? h : 15);
              t.tTrace.push(b === 'T' ? h : 15);
              t.gTrace.push(b === 'G' ? h : 15);
              t.cTrace.push(b === 'C' ? h : 15);
            }
            return t;
          })
        };
      }

      const ALIGNMENT = {
        alignmentType: 'Sanger sequencing',
        tracks: [
          {
            sequenceData: {
              name: 'demo-reference', sequence: REF, circular: false,
              features: [
                { id: 'f1', name: 'demo feature', start: 5, end: 40, strand: 1, type: 'CDS' },
                // Three letters exactly. Open Vector Editor blanked any name of
                // three characters or fewer, however wide the feature, so this
                // is the case that must keep drawing its label.
                { id: 'f2', name: 'CDF', start: 120, end: 260, strand: 1, type: 'misc_feature' }
              ]
            },
            alignmentData: { name: 'demo-reference', sequence: REF }
          },
          {
            sequenceData: { name: 'clean-read', sequence: CLEAN, circular: false },
            alignmentData: { name: 'clean-read', sequence: CLEAN },
            chromatogramData: fakeChrom(CLEAN)
          },
          {
            sequenceData: { name: 'window-read', sequence: WINDOW, circular: false },
            alignmentData: { name: 'window-read', sequence: WINDOW_ROW },
            chromatogramData: fakeChrom(WINDOW)
          },
          {
            /*
             * A read that crosses the origin, with a deletion at the junction.
             * It lands in two pieces: ref 240-299 and ref 30-89, having read
             * straight through 0-29 and not found it. Ref 90-239 it never
             * reached. Those two absences must not be drawn the same way.
             */
            // Handed over in the row's order (ref 30-89 then 240-299), which is
            // how the aligner emits a folded read.
            sequenceData: {
              name: 'wrap-read',
              sequence: REF.slice(30, 90) + REF.slice(240),
              circular: false
            },
            alignmentData: {
              name: 'wrap-read',
              sequence: '-'.repeat(30) + REF.slice(30, 90) + '-'.repeat(150) + REF.slice(240)
            },
            ovenCoverage: { covered: [[30, 89], [240, 299]], deleted: [[0, 29]] }
          },
          {
            // No chromatogramData at all -- stands in for a GenBank read, which
            // must render without a trace rather than breaking the view.
            sequenceData: {
              name: 'gb-read', sequence: DELETED, circular: false,
              // What the host emits for a substitution inside a CDS: a
              // translation over just that codon, in read coordinates, so the
              // viewer derives the amino acid from the read's own bases.
              translations: [{ id: 'mut-0-0', start: 60, end: 62, strand: 1, forward: true }]
            },
            alignmentData: { name: 'gb-read', sequence: DELETED_ROW }
          }
        ]
      };

      let state = {
        reference: { name: 'demo-reference', length: REF.length, circular: true },
        reads: [
          { id: 1, name: 'clean-read.ab1', path: '/demo/clean-read.ab1', length: CLEAN.length },
          { id: 2, name: 'window-read.ab1', path: '/demo/window-read.ab1', length: WINDOW.length },
          { id: 3, name: 'gb-read.gb', path: '/demo/gb-read.gb', length: DELETED.length },
          { id: 4, name: 'wrong-plasmid.ab1', path: '/demo/wrong.ab1', length: 40 }
        ],
        alignment: null, status: '', error: '', busy: false,
        // Starts missing so the banner is exercised; __mafftFound flips it.
        mafft: { ok: false, message: 'MAFFT was not found. Install it with "brew install mafft".' }
      };

      const send = () => window.postMessage({ type: 'align/state', state }, '*');

      function acquireVsCodeApi() {
        return {
          postMessage: (m) => {
            window.__posted.push(m);
            syncPosted();
            if (m.type === 'align/ready') { send(); return; }
            if (m.type === 'align/run') {
              state = Object.assign({}, state, {
                alignment: ALIGNMENT,
                status: 'Aligned 2 reads in 12 ms',
                reads: [
                  // compared === REF.length only for the read that spans it all.
                  Object.assign({}, state.reads[0], {
                    mismatches: 0, substitutions: 0, gaps: 0, identity: 1,
                    compared: REF.length, strand: 1, rotation: 0, anchored: true
                  }),
                  Object.assign({}, state.reads[1], {
                    mismatches: 0, substitutions: 0, gaps: 0, identity: 1,
                    compared: WINDOW.length, strand: 1, rotation: 0, anchored: true
                  }),
                  Object.assign({}, state.reads[2], {
                    mismatches: 3, substitutions: 0, gaps: 3, identity: 0.95,
                    compared: DELETED.length, strand: 1, rotation: 0, anchored: true
                  }),
                  Object.assign({}, state.reads[3], {
                    mismatches: 31, substitutions: 31, gaps: 0, identity: 0.42,
                    compared: 40, strand: 1, rotation: 0, anchored: false
                  })
                ]
              });
              send();
              return;
            }
            if (m.type === 'align/remove') {
              state = Object.assign({}, state, {
                reads: state.reads.filter((r) => r.id !== m.id), alignment: null
              });
              send();
              return;
            }
            // addUris / addBytes: echo back a row so the drop paths are visible.
            if (m.type === 'align/addUris' || m.type === 'align/addBytes') {
              const names = m.type === 'align/addUris'
                ? m.uris.map((u) => u.split('/').pop())
                : m.files.map((f) => f.name);
              const fresh = names
                .filter((n) => !state.reads.some((r) => r.name === n))
                .map((n, i) => ({ id: 100 + state.reads.length + i, name: n, length: 42 }));
              state = Object.assign({}, state, { reads: state.reads.concat(fresh) });
              send();
            }
          }
        };
      }

      document.addEventListener('__clearPosted', () => { window.__posted.length = 0; syncPosted(); });
      /*
       * What a copy put on the clipboard.
       *
       * The alignment view copies through a throwaway <textarea> and
       * document.execCommand, which a headless browser will not perform and the
       * driver cannot read back. Recording the textarea's value at the moment
       * execCommand is called captures exactly what would have been copied.
       */
      document.addEventListener('__captureAlignCopy', () => {
        window.__alignCopies = [];
        const log = document.getElementById('copyLog');
        const real = document.execCommand.bind(document);
        document.execCommand = (cmd, ...rest) => {
          if (cmd === 'copy' && document.activeElement && 'value' in document.activeElement) {
            window.__alignCopies.push(document.activeElement.value);
            log.textContent = JSON.stringify(window.__alignCopies);
          }
          return real(cmd, ...rest);
        };
        const realWrite = navigator.clipboard && navigator.clipboard.writeText;
        if (realWrite) {
          navigator.clipboard.writeText = (text) => {
            window.__alignCopies.push(text);
            log.textContent = JSON.stringify(window.__alignCopies);
            return Promise.resolve();
          };
        }
      });
      document.addEventListener('__mafftFound', () => {
        state = Object.assign({}, state, {
          mafft: { ok: true, path: '/opt/homebrew/bin/mafft', version: 'v7.526' }
        });
        send();
      });
    </script>

    <pre id="copyLog"></pre>

    <div class="ovealign-root">
      <div id="setup" class="ovealign-setup"></div>
      <div id="view" class="ovealign-view"></div>
    </div>

    <script src="index.umd.js"></script>
    <script src="cartShared.js"></script>
    <script src="alignView.js"></script>
    <script>
      // alignView.js renders synchronously on load and asks for state, which
      // the stub answers immediately.
      setTimeout(() => { document.body.dataset.ready = 'true'; }, 50);
    </script>
  </body>
</html>
